                 radial-gradient(circle at 50% 42%,transparent 25%,rgba(7,13,10,.65) 100%)}
  @keyframes bgZoom{from{transform:scale(1) translateY(0)}to{transform:scale(1.08) translateY(-1.5%)}}

  header{padding:28px 32px 12px;display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between;position:relative}
  h1{font-family:"Barlow Condensed";font-size:42px;margin:0;letter-spacing:.5px;text-transform:uppercase;
     text-shadow:0 2px 24px rgba(0,0,0,.6);animation:rise .7s cubic-bezier(.2,.7,.3,1) backwards}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);margin-top:4px;animation:rise .7s .1s cubic-bezier(.2,.7,.3,1) backwards}
  .ctrl{display:flex;align-items:center;gap:10px;background:rgba(18,32,26,.82);backdrop-filter:blur(8px);
    border:1px solid var(--line);padding:10px 14px;border-radius:12px;animation:rise .7s .15s cubic-bezier(.2,.7,.3,1) backwards}
  select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:600 15px Barlow}
  .grid{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:16px;padding:12px 32px;overflow-x:auto}
  .block{background:linear-gradient(165deg,rgba(18,32,26,.9),rgba(24,43,35,.78));backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;
    border-top:4px solid var(--cc);min-width:220px;transition:box-shadow .3s;
    animation:rise .6s cubic-bezier(.2,.7,.3,1) backwards}
  .block.glow{box-shadow:0 0 0 2px var(--cc),0 0 40px -6px var(--cc)}
  .bhead{padding:14px 14px 10px}
  .bhead h2{font-family:"Barlow Condensed";font-size:21px;margin:0;line-height:1.1;color:var(--cc);text-transform:uppercase}
  .bhead small{color:var(--muted)}
  .list{max-height:430px;overflow-y:auto;overflow-x:hidden;padding:4px 10px 12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:thin;scrollbar-color:var(--line) rgba(0,0,0,.25)}
  .list::-webkit-scrollbar{width:9px}
  .list::-webkit-scrollbar-track{background:rgba(0,0,0,.28);border-radius:5px}
  .list::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;border:1px solid rgba(0,0,0,.2)}
  .list::-webkit-scrollbar-thumb:hover{background:var(--cc)}
  .bhead .sorts{display:flex;gap:6px;margin-top:9px}
  .sbtn{padding:3px 10px;font:700 12.5px "Barlow Condensed";letter-spacing:.6px;background:rgba(24,43,35,.9);
    color:var(--muted);border:1px solid var(--line);border-radius:8px;cursor:pointer;text-transform:uppercase;transition:color .15s,border-color .15s}
  .sbtn:hover{border-color:var(--cc);color:var(--text)}
  .sbtn.on{border-color:var(--cc);color:var(--cc);background:rgba(24,43,35,.95);box-shadow:0 0 10px -3px var(--cc)}
  /* ---------- pitch map ---------- */
  .pitchwrap{margin-top:22px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .pitchwrap h3{margin:0 0 4px;font:700 17px "Barlow Condensed";text-transform:uppercase;color:var(--accent);letter-spacing:.5px}
  .pitchnote{color:var(--muted);font-size:12px;margin:0 0 10px}
  .pitch{display:block;width:100%;max-width:860px;margin:0 auto;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .pcard{display:flex;gap:10px;align-items:center;background:rgba(24,43,35,.85);border:1px solid transparent;border-radius:12px;
    padding:8px;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;
    animation:rise .45s cubic-bezier(.2,.7,.3,1) backwards}
  .pcard:hover{transform:translateX(3px) translateY(-1px);border-color:var(--cc);background:rgba(32,55,43,.9)}
  .pcard.sel{border-color:var(--accent);background:#20372b;animation:selPulse 1.9s ease-in-out infinite}
  @keyframes selPulse{0%,100%{box-shadow:0 0 0 0 rgba(198,244,50,.30)}50%{box-shadow:0 0 0 7px rgba(198,244,50,0)}}
  .pcard.moved{animation:land .7s ease-out}
  @keyframes land{0%{transform:scale(1.25);background:var(--cc)}100%{transform:scale(1)}}
  .ph{width:48px;height:48px;border-radius:50%;background:var(--line);object-fit:cover;flex-shrink:0;border:2px solid var(--cc);
      box-shadow:0 3px 10px rgba(0,0,0,.35)}
  .avatar{display:flex;align-items:center;justify-content:center;font:700 16px "Barlow Condensed";color:#fff;
      text-shadow:0 1px 3px rgba(0,0,0,.5);letter-spacing:.5px}
  .pinfo{min-width:0;flex:1}
  .pinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pinfo span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ovr{font:700 22px "Barlow Condensed";color:var(--accent)}
  .pinfo .tag{display:inline;color:#102010;font-size:10px;background:var(--accent);color:#102010;border-radius:4px;padding:1px 5px;margin-left:4px;font-weight:700}
  #details{margin:20px 32px 60px;background:linear-gradient(165deg,rgba(18,32,26,.92),rgba(24,43,35,.82));
    backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:24px;animation:rise .5s backwards}
  .empty{color:var(--muted);text-align:center;padding:30px}
  .dtop{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .dtop img,.dtop .avatar{width:96px;height:96px;border-radius:50%;border:3px solid var(--cc);background:var(--line);font-size:30px}
  .dtop h2{font-family:"Barlow Condensed";font-size:34px;margin:0}
  .badge{display:inline-block;margin-top:6px;padding:5px 12px;border-radius:20px;background:var(--cc);color:#0b1410;font-weight:700;transition:background .4s}
  .stats{display:flex;gap:18px;color:var(--muted);flex-wrap:wrap;margin-top:6px}
  .stats b{color:var(--text)}
  .actions{margin-left:auto;display:flex;gap:10px}
  button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font:600 14px Barlow;cursor:pointer}
  button:hover{border-color:var(--accent)}
  .fams{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:22px}
  .fam{background:var(--panel2);border-radius:14px;padding:14px 16px}
  .fam h3{margin:0 0 10px;font:700 17px "Barlow Condensed";text-transform:uppercase;color:var(--accent);letter-spacing:.5px}
  .sk{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
  .sk label{color:var(--muted);text-transform:capitalize}
  .sk output{font-weight:700;text-align:right}
  .sk output.chg{color:var(--accent)}
  input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer}

  /* ---------- flying ball + player ---------- */
  .flyer{position:fixed;top:0;left:0;z-index:999;pointer-events:none;width:104px;height:104px;
         display:flex;flex-direction:column;align-items:center;will-change:transform}
  .flyer::before{content:"";position:absolute;inset:-38%;border-radius:50%;
    background:radial-gradient(circle,var(--cc) 0%,transparent 62%);filter:blur(16px);opacity:.5;
    animation:trailPulse .45s ease-in-out infinite alternate}
  @keyframes trailPulse{from{opacity:.35;transform:scale(.92)}to{opacity:.65;transform:scale(1.1)}}
  .ballwrap{position:absolute;inset:0}
  .ballimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));animation:ballSpin .85s linear infinite}
  @keyframes ballSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .rider{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;
    object-fit:cover;border:3px solid var(--cc);box-shadow:0 0 18px var(--cc),0 4px 12px rgba(0,0,0,.55)}
  .rider-avatar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;
    border:3px solid var(--cc);box-shadow:0 0 18px var(--cc);font-size:15px}
  .flyname{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);background:var(--accent);color:#0b1410;
    padding:2px 10px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}

  /* ---------- landing fx ---------- */
  #fx{position:fixed;inset:0;z-index:998;pointer-events:none}
  .ring{position:fixed;z-index:998;pointer-events:none;border-radius:50%;border:3px solid var(--cc);
    box-shadow:0 0 24px var(--cc);animation:ringPop .75s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes ringPop{from{opacity:.95;transform:scale(.15)}to{opacity:0;transform:scale(2.4)}}
  .goal{position:fixed;z-index:998;pointer-events:none;font:700 46px "Barlow Condensed";text-transform:uppercase;
    color:var(--cc);text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 34px var(--cc);letter-spacing:3px;
    animation:goalPop 1s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes goalPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}
    22%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(-3deg)}
    40%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
    100%{opacity:0;transform:translate(-50%,-72%) scale(1.05) rotate(-3deg)}}

  /* ---------- broadcast toast ---------- */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px) skewX(-8deg);opacity:0;
    background:linear-gradient(90deg,var(--accent),#9fd624);color:#0b1410;
    padding:12px 26px;border-radius:10px;font:700 16px "Barlow Condensed";text-transform:uppercase;letter-spacing:1.5px;
    box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 2px rgba(255,255,255,.12) inset;transition:transform .35s cubic-bezier(.2,.7,.3,1),opacity .35s;z-index:1000}
  .toast.show{transform:translateX(-50%) translateY(0) skewX(-8deg);opacity:1}

  @keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<canvas id="fx"></canvas>
<header>
  <div>
    <h1>FIFA 20 <span>Player Clusters</span></h1>
    <div class="sub">K-Means on 34 skill ratings · click a player, change skills, watch them ride the ball to a new cluster</div>
  </div>
  <div class="ctrl">
    <label for="top">Show</label>
    <select id="top">
      <option value="1">Top 1</option><option value="2">Top 2</option><option value="3">Top 3</option>
      <option value="4">Top 4</option><option value="5" selected>Top 5</option><option value="6">Top 6</option>
      <option value="7">Top 7</option><option value="8">Top 8</option><option value="9">Top 9</option>
      <option value="10">Top 10</option><option value="all">All players</option>
    </select>
  </div>
</header>

<section class="grid" id="grid"></section>
<section id="details"><div class="empty">Select a player from any cluster block to see and edit his skills.</div></section>
<div class="toast" id="toast"></div>

let ORDER = [], data = {}, current = null, original = null, liveCluster = null, timer = null;
const moved = {};               // player id -> {card, cluster} for players moved by editing

const $ = s => document.querySelector(s);
const colorOf = n => COLORS[ORDER.indexOf(n)] || "var(--accent)";
const initials = n => n.split(/[\s.-]+/).filter(Boolean).map(w => w[0]).slice(0,2).join("").toUpperCase();
const pretty = f => f.split("_").slice(1).join(" ");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const hueOf = s => { let h = 0; for (const ch of String(s)) h = (h*31 + ch.charCodeAt(0)) % 360; return h; };

/* ---------- photos: proxy -> direct CDN -> image proxy -> styled initials avatar ---------- */
function photoChain(p){
  return [
    `/api/photo/${p.id}`,
    p.photo,
    "https://images.weserv.nl/?url=" + encodeURIComponent(p.photo)
  ];
}
function avatarHTML(name, cls){
  const hue = hueOf(name);
  return `<div class="${cls} avatar" style="background:linear-gradient(135deg,hsl(${hue} 48% 40%),hsl(${(hue+42)%360} 58% 26%))">${esc(initials(name))}</div>`;
}
function photo(p, cls="ph"){
  return `<img class="${cls}" src="${photoChain(p)[0]}" data-chain="${esc(photoChain(p).join("|"))}" data-i="0"
    alt="${esc(p.name)}" loading="lazy" onerror="nextPhoto(this)">`;
}
function nextPhoto(img){
  const chain = (img.dataset.chain || "").split("|").filter(Boolean);
  const i = (+img.dataset.i || 0) + 1;
  if (i < chain.length && chain[i]){ img.dataset.i = i; img.src = chain[i]; }
  else img.outerHTML = avatarHTML(img.alt, img.className);
}
window.nextPhoto = nextPhoto;

/* ---------- data ---------- */
async function loadClusters(){
  const top = $("#top").value;
  const r = await fetch(`/api/clusters?top=${top}`); data = await r.json();
  ORDER = data.clusters.map(c => c.name);
  render();
}

/* ---------- sorting + lazy "scroll all players" lists ---------- */
const sortState = {};          // cluster name -> {key:"score"|"name", dir:"desc"|"asc"}
const CHUNK = 80;              // cards rendered per batch; more load as you scroll

function sortOf(c){ return sortState[c.name] || (sortState[c.name] = {key:"score", dir:"desc"}); }

function playersFor(c){
  const movedIds = new Set(Object.keys(moved).map(Number));
  const all = [
    ...Object.values(moved).filter(m => m.cluster === c.name).map(m => ({...m.card, _moved:true})),
    ...c.players.filter(p => !movedIds.has(p.id))
  ];
  const s = sortOf(c);
  if (s.key === "score")
    all.sort((a,b) => s.dir === "desc"
      ? (b.overall - a.overall || a.name.localeCompare(b.name))
      : (a.overall - b.overall || a.name.localeCompare(b.name)));
  else
    all.sort((a,b) => s.dir === "asc" ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
  return all;
}

function renderList(c, list){
  const all = playersFor(c);
  let shown = 0;
  const addMore = () => {
    const frag = document.createDocumentFragment();
    const end = Math.min(shown + CHUNK, all.length);
    for (let i = shown; i < end; i++) frag.appendChild(cardEl(all[i], all[i]._moved));
    shown = end;
    list.appendChild(frag);
  };
  addMore();
  list.onscroll = () => { if (list.scrollTop + list.clientHeight >= list.scrollHeight - 400) addMore(); };
}

function render(){
  const grid = $("#grid"); grid.innerHTML = "";
  data.clusters.forEach((c, i) => grid.appendChild(buildBlock(c, i)));
}

function buildBlock(c, i){
  const s = sortOf(c);
  const b = document.createElement("div");
  b.className = "block"; b.style.setProperty("--cc", COLORS[i]); b.dataset.cluster = c.name;
  b.style.animationDelay = (i * 90) + "ms";
  const scoreLbl = "OVR " + (s.key === "score" ? (s.dir === "desc" ? "▼" : "▲") : "▼");
  const nameLbl  = s.key === "name" ? (s.dir === "asc" ? "A–Z ▲" : "Z–A ▼") : "A–Z";
  b.innerHTML = `<div class="bhead"><h2>${esc(c.name)}</h2><small>${c.total.toLocaleString()} players in cluster</small>
    <div class="sorts">
      <button class="sbtn${s.key === "score" ? " on" : ""}" data-key="score" title="Sort by score">${scoreLbl}</button>
      <button class="sbtn${s.key === "name" ? " on" : ""}" data-key="name" title="Sort by name">${nameLbl}</button>
    </div></div><div class="list"></div>`;
  b.querySelectorAll(".sbtn").forEach(btn => btn.onclick = () => {
    const k = btn.dataset.key;
    if (s.key === k) s.dir = s.dir === "desc" ? "asc" : "desc";
    else { s.key = k; s.dir = k === "score" ? "desc" : "asc"; }
    b.replaceWith(buildBlock(c, i));
  });
  renderList(c, b.querySelector(".list"));
  return b;
}

function cardEl(p, isMoved=false){
  const d = document.createElement("div");
  d.className = "pcard" + (current && current.id === p.id ? " sel" : "");
  d.dataset.id = p.id;
  d.innerHTML = `${photo(p)}<div class="pinfo"><b>${esc(p.name)}${isMoved ? '<span class="tag">EDITED</span>' : ""}</b>
    <span>${esc(p.position)}</span><span>${esc(p.club)}</span></div><div class="ovr">${p.overall}</div>`;
  d.onclick = () => selectPlayer(p.id);
  return d;
}

      </linearGradient>

    </defs>
    <rect width="1050" height="680" fill="url(#turf${uid})"/>
    <g style="fill:#ffffff;fill-opacity:.045">${stripes}</g>
    <g style="fill:none;stroke:#e9f3ec;stroke-opacity:.5;stroke-width:3">
      <rect x="10" y="10" width="1030" height="660"/>
      <line x1="525" y1="10" x2="525" y2="670"/>
      <circle cx="525" cy="340" r="91.5"/>
      <rect x="10" y="138" width="165" height="404"/>
      <rect x="10" y="248" width="55" height="184"/>
      <rect x="875" y="138" width="165" height="404"/>
      <rect x="985" y="248" width="55" height="184"/>
      <path d="M 175 266.9 A 91.5 91.5 0 0 1 175 413.1"/>
      <path d="M 875 266.9 A 91.5 91.5 0 0 0 875 413.1"/>
      <circle cx="525" cy="340" r="3" style="fill:#e9f3ec;stroke:none"/>
      <circle cx="120" cy="340" r="3" style="fill:#e9f3ec;stroke:none"/>
      <circle cx="930" cy="340" r="3" style="fill:#e9f3ec;stroke:none"/>
    </g>
    <rect x="0" y="302" width="10" height="76" style="fill:var(--cc);fill-opacity:.4"/>
    <rect x="1040" y="302" width="10" height="76" style="fill:var(--cc);fill-opacity:.4"/>
    <text transform="rotate(-90 34 340)" x="34" y="340" text-anchor="middle" style="fill:#8fa99a;font:600 15px 'Barlow Condensed';letter-spacing:2px">OWN GOAL</text>
    <text transform="rotate(-90 1016 340)" x="1016" y="340" text-anchor="middle" style="fill:#8fa99a;font:600 15px 'Barlow Condensed';letter-spacing:2px">OPPONENT GOAL</text>
    <g>${marks}</g>
    <g>
      <circle cx="${px}" cy="${py}" r="54" style="fill:var(--cc);fill-opacity:.16"/>
      <circle cx="${px}" cy="${py}" r="42" style="fill:#0b1410;stroke:var(--cc);stroke-width:3.5"/>
      <text x="${px}" y="${py + 9}" text-anchor="middle" style="fill:#e9f3ec;font:700 17px 'Barlow Condensed';letter-spacing:1px">${esc(initials(p.name))}</text>
      <image href="${photoChain(p)[0]}" x="${px - 40}" y="${py - 40}" width="80" height="80"
        clip-path="url(#clip${uid})" preserveAspectRatio="xMidYMid slice"/>
      <text x="${px}" y="${py + 74}" text-anchor="middle" style="fill:var(--cc);font:700 19px 'Barlow Condensed';letter-spacing:1.5px">${esc(primary)}</text>
    </g>
  </svg>
  <p class="pitchnote">${esc(primary)} is his main spot${secondaries.length ? " · " + esc(secondaries.join(", ")) + " are also natural roles" : ""}</p>`;
}

async function selectPlayer(id){
  const r = await fetch(`/api/player/${id}`); const p = await r.json();
  current = p; original = JSON.parse(JSON.stringify(p.skills));
  if (moved[id]) { current.skills = moved[id].skills; liveCluster = moved[id].cluster; }
  else liveCluster = p.cluster;
  document.querySelectorAll(".pcard").forEach(c => c.classList.toggle("sel", +c.dataset.id === id));
  renderDetails();
  $("#details").scrollIntoView({behavior:"smooth", block:"start"});
}

function renderDetails(){
  const p = current, fams = {};
  Object.keys(p.skills).forEach(f => { const k = f.split("_")[0]; (fams[k] = fams[k] || []).push(f); });
  const el = $("#details"); el.style.setProperty("--cc", colorOf(liveCluster));
  el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
  el.innerHTML = `
    <div class="dtop">
      ${photo(p, "dphoto")}
      <div><h2>${esc(p.long_name)}</h2>
        <div class="stats"><span>Age <b>${p.age}</b></span><span>${esc(p.nationality)}</span><span>${esc(p.club)}</span>
          <span>Pos <b>${esc(p.position)}</b></span><span>OVR <b>${p.overall}</b></span><span>POT <b>${p.potential}</b></span></div>
        <div class="badge" id="badge">${esc(liveCluster)}</div>
      </div>
      <div class="actions"><button id="reset">Reset skills</button></div>
    </div>
    <div class="fams">${Object.entries(fams).map(([k, fs]) => `
      <div class="fam"><h3>${esc(k)}</h3>${fs.map(f => `
        <div class="sk"><label for="${f}">${esc(pretty(f))}</label>
          <input type="range" id="${f}" min="1" max="99" value="${p.skills[f] ?? 50}">
          <output id="o_${f}" class="${p.skills[f] !== original[f] ? "chg" : ""}">${p.skills[f] ?? "–"}</output></div>`).join("")}
      </div>`).join("")}</div>
    <div class="pitchwrap"><h3>Position on the pitch</h3>${pitchSVG(p)}</div>`;
  el.querySelectorAll("input[type=range]").forEach(inp => inp.oninput = () => {
    p.skills[inp.id] = +inp.value;
    const o = $("#o_" + inp.id); o.textContent = inp.value; o.classList.toggle("chg", +inp.value !== original[inp.id]);
    clearTimeout(timer); timer = setTimeout(predict, 120);
  });
  $("#reset").onclick = () => { current.skills = JSON.parse(JSON.stringify(original)); renderDetails(); predict(); };
}

async function predict(){
  const r = await fetch("/api/predict", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({skills: current.skills})});
  const {cluster} = await r.json();
  const edited = Object.keys(original).some(f => original[f] !== current.skills[f]);
  if (cluster !== liveCluster){ const from = liveCluster; liveCluster = cluster; await jump(from, cluster, edited); }
  else if (moved[current.id]) moved[current.id].skills = current.skills;
}

/* ---------- flying football + player, particles, shockwave, GOAL! ---------- */
function jump(from, to, edited){
  return new Promise(resolve => {
    const id = current.id;
    const srcCard = document.querySelector(`.block[data-cluster="${CSS.escape(from)}"] .pcard[data-id="${id}"]`);
    const srcBlock = document.querySelector(`.block[data-cluster="${CSS.escape(from)}"]`);
    const dstBlock = document.querySelector(`.block[data-cluster="${CSS.escape(to)}"]`);
    const s = (srcCard || srcBlock).getBoundingClientRect();
    const dList = dstBlock.querySelector(".list").getBoundingClientRect();
    const cc = getComputedStyle(dstBlock).getPropertyValue("--cc").trim();

    const fly = document.createElement("div"); fly.className = "flyer";
    fly.style.setProperty("--cc", cc);
    const ph = photo(current);
    fly.innerHTML = `<div class="ballwrap"><img class="ballimg" src="${BALL_IMG}" alt="">
      ${ph.replace(/class="(ph|dphoto)"/, 'class="rider"').replace(/class="(ph|dphoto) avatar"/, 'class="rider-avatar avatar"')}</div>
      <b class="flyname">${esc(current.name)}</b>`;
    document.body.appendChild(fly);

    const sx = s.left + 6, sy = s.top + 2, dx = dList.left + dList.width/2 - 52, dy = dList.top + 4;
    const peak = Math.min(sy, dy) - 170;
    const kf = [];
    for (let t = 0; t <= 1.0001; t += 0.08){             // parabolic arc
      const x = sx + (dx - sx) * t;
      const y = (1-t)*(1-t)*sy + 2*(1-t)*t*peak + t*t*dy;
      const sc = 1 + Math.sin(Math.PI * t) * 0.45;
      kf.push({transform:`translate(${x}px,${y}px) scale(${sc})`});
    }
    if (srcCard) srcCard.style.opacity = .25;
    srcBlock.classList.add("glow");
    const a = fly.animate(kf, {duration: 1250, easing: "cubic-bezier(.45,.05,.55,.95)"});
    a.onfinish = () => {
      const lx = dx + 52, ly = dy + 40;
      fly.remove(); srcBlock.classList.remove("glow");
      burst(lx, ly, cc);                                  // particle explosion
      shockwave(lx, ly, cc);                              // ring shockwave
      goalText(lx, Math.max(70, ly - 110), cc);           // GOAL! flash
      const c = { id, name: current.name, overall: current.overall, position: current.position, club: current.club, photo: current.photo };
      if (!edited || to === current.cluster) delete moved[id];
      else moved[id] = { card: c, cluster: to, skills: current.skills };
      render();
      const nb = document.querySelector(`.block[data-cluster="${CSS.escape(to)}"]`);
      const nc = nb.querySelector(`.pcard[data-id="${id}"]`);
      nb.classList.add("glow"); setTimeout(() => nb.classList.remove("glow"), 900);
      if (nc){ nc.classList.add("moved"); nc.scrollIntoView({block:"nearest"}); }
      $("#details").style.setProperty("--cc", colorOf(to)); $("#badge").textContent = to;
      toast(`${current.name}  ${from} → ${to}`);
      resolve();
    };
  });
}

/* particle canvas */
const fxCv = $("#fx"), fxCx = fxCv.getContext("2d");
let parts = [], fxRunning = false;
function sizeFx(){ fxCv.width = innerWidth * devicePixelRatio; fxCv.height = innerHeight * devicePixelRatio;
  fxCx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
sizeFx(); addEventListener("resize", sizeFx);
function burst(x, y, color){
  for (let i = 0; i < 46; i++){
    const ang = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 330;
    parts.push({x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp - 90, r: 1.5 + Math.random()*3,
      life: 1, decay: .012 + Math.random()*.02,
      col: [color, "#c6f432", "#ffffff"][i % 3]});
  }
  if (!fxRunning){ fxRunning = true; requestAnimationFrame(fxLoop); }
}
function fxLoop(){
  fxCx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts){
    p.x += p.vx/60; p.y += p.vy/60; p.vy += 560/60; p.vx *= .985; p.life -= p.decay;
    fxCx.globalAlpha = Math.max(0, p.life);
    fxCx.fillStyle = p.col; fxCx.shadowColor = p.col; fxCx.shadowBlur = 8;
    fxCx.beginPath(); fxCx.arc(p.x, p.y, p.r, 0, Math.PI*2); fxCx.fill();
  }
  fxCx.globalAlpha = 1; fxCx.shadowBlur = 0;
  if (parts.length) requestAnimationFrame(fxLoop); else { fxRunning = false; fxCx.clearRect(0,0,innerWidth,innerHeight); }
}
function shockwave(x, y, color){
  const r = document.createElement("div"); r.className = "ring";
  r.style.setProperty("--cc", color);
  const D = 120; r.style.width = r.style.height = D + "px";
  r.style.left = (x - D/2) + "px"; r.style.top = (y - D/2) + "px";
  document.body.appendChild(r); setTimeout(() => r.remove(), 800);
}
function goalText(x, y, color){
  const g = document.createElement("div"); g.className = "goal"; g.textContent = "GOAL!";
  g.style.setProperty("--cc", color);
  g.style.left = x + "px"; g.style.top = y + "px";
  document.body.appendChild(g); setTimeout(() => g.remove(), 1050);
}

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2200); }

$("#top").onchange = loadClusters;
loadClusters();
</script>
